<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>

  <rect x="20" y="163" width="185" height="100" rx="8" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/>
  <text x="112" y="197" text-anchor="middle" font-size="16" font-weight="600" fill="#1a202c">Host</text>
  <text x="112" y="228" text-anchor="middle" font-size="14" fill="#2d3748">Python script</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
  <line x1="205" y1="188" x2="292" y2="188" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="248" y="180" text-anchor="middle" font-size="12" fill="#2d3748">prompt</text>
  <line x1="292" y1="238" x2="205" y2="238" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="248" y="258" text-anchor="middle" font-size="12" fill="#2d3748">tokens out</text>
  <text x="248" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#718096">1GbE link</text>

  <rect x="300" y="30" width="558" height="370" rx="10" fill="#f7fafc" stroke="#2d3748" stroke-width="2"/>
  <text x="579" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">FPGA — Kintex-7 xc7k480t</text>

  <rect x="325" y="72" width="508" height="182" rx="8" fill="#e6eef8" stroke="#3182ce" stroke-width="1.5"/>
  <text x="579" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#1a365d">GMP SoC</text>

  <rect x="353" y="112" width="140" height="52" rx="5" fill="#ffffff" stroke="#3182ce" stroke-width="1"/>
  <text x="423" y="134" text-anchor="middle" font-size="13" fill="#1a365d">RV32 core</text>
  <text x="423" y="152" text-anchor="middle" font-size="11" fill="#4a6fa5">config and Launch</text>

  <rect x="509" y="112" width="140" height="52" rx="5" fill="#ffffff" stroke="#3182ce" stroke-width="1"/>
  <text x="579" y="134" text-anchor="middle" font-size="13" fill="#1a365d">2D matrix unit</text>
  <text x="579" y="152" text-anchor="middle" font-size="11" fill="#4a6fa5">980 DSPs</text>

  <rect x="665" y="112" width="140" height="52" rx="5" fill="#ffffff" stroke="#3182ce" stroke-width="1"/>
  <text x="735" y="134" text-anchor="middle" font-size="13" fill="#1a365d">1D vector unit</text>
  <text x="735" y="152" text-anchor="middle" font-size="11" fill="#4a6fa5">reduction, activation</text>

  <rect x="353" y="180" width="218" height="46" rx="5" fill="#ffffff" stroke="#3182ce" stroke-width="1"/>
  <text x="462" y="200" text-anchor="middle" font-size="13" fill="#1a365d">L1 buffer</text>
  <text x="462" y="217" text-anchor="middle" font-size="11" fill="#4a6fa5">512 KiB, compiler-placed</text>

  <rect x="587" y="180" width="218" height="46" rx="5" fill="#ffffff" stroke="#3182ce" stroke-width="1"/>
  <text x="696" y="200" text-anchor="middle" font-size="13" fill="#1a365d">DMA and on-chip fabric</text>
  <text x="696" y="217" text-anchor="middle" font-size="11" fill="#4a6fa5">moves weights and tensors</text>

  <line x1="579" y1="254" x2="579" y2="292" stroke="#dd6b20" stroke-width="2" marker-end="url(#a)"/>

  <rect x="325" y="294" width="508" height="84" rx="8" fill="#fdf0e1" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="579" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#7b341e">DDR3 — two channels</text>
  <text x="410" y="345" text-anchor="middle" font-size="13" fill="#7b341e">weights 762 MiB</text>
  <text x="579" y="345" text-anchor="middle" font-size="13" fill="#7b341e">KV cache</text>
  <text x="748" y="345" text-anchor="middle" font-size="13" fill="#7b341e">program image 52 KB</text>
  <text x="410" y="365" text-anchor="middle" font-size="11" fill="#9c4221">tiled by the compiler</text>
  <text x="579" y="365" text-anchor="middle" font-size="11" fill="#9c4221">K and V, 28 layers</text>
  <text x="748" y="365" text-anchor="middle" font-size="11" fill="#9c4221">prefill and decode</text>
</svg>
